name: Release

# Tags only. Deliberately not runnable from a pull request: a PR can change
# the workflow it runs under, so anything holding publish rights must never be
# triggerable by one.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      # PyPI versions are immutable, so a tag that disagrees with the version
      # cannot be corrected afterwards -- only superseded. Cheaper to fail here.
      - name: Tag must match the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match pyproject version $version"
            exit 1
          fi

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Named so PyPI's trusted publisher can be scoped to it, and so the
    # publish step can be given approval rules later without touching CI.
    environment: pypi
    permissions:
      # The whole point of trusted publishing: GitHub mints a short-lived
      # identity token and PyPI verifies it. No API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
