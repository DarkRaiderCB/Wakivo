[project]
name = "wakivo"
version = "0.1.0"
description = "Keep your machine awake while your work runs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sanyog Mishra" }]
keywords = [
    "keep-awake",
    "caffeine",
    "insomnia",
    "sleep",
    "power-management",
    "wakelock",
    "menu-bar",
    "tray",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    # Cross-platform support is the whole pitch, so these are the classifiers
    # that matter most for being found.
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/DarkRaiderCB/Wakivo"
Repository = "https://github.com/DarkRaiderCB/Wakivo"
Issues = "https://github.com/DarkRaiderCB/Wakivo/issues"

[project.scripts]
wakivo = "wakivo.cli:main"

[project.gui-scripts]
# A GUI script, so Windows uses a pythonw launcher and no console window
# flashes up behind the tray icon.
wakivo-gui = "wakivo.gui:main"

[project.optional-dependencies]
gui = [
    "pillow>=12.3.0",
    "pystray>=0.19.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wakivo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
