[project]
name = "oncafe"
version = "0.1.0"
description = "Keep your machine awake for as long as a task actually runs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
oncafe = "oncafe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncafe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
